name: Sandbox Images

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - Dockerfile.sandbox-lite
      - scripts/publish-sandbox-images.sh
      - .github/workflows/sandbox-images.yml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sandbox-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sandbox-image:
    name: Publish sandbox images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push sandbox images
        run: bash scripts/publish-sandbox-images.sh
