name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sandbox-image:
    name: Publish sandbox image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push sandbox image
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/$owner/aithy-sandbox"
          ref_tag="$(printf '%s' "${GITHUB_REF_NAME:-manual}" | tr '/:@' '---')"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$image:$ref_tag" \
            -t "$image:latest" \
            --push \
            .

  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check

  package:
    name: Package ${{ matrix.target }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-gnu
          - target: linux-arm64-gnu
          - target: darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Build portable package
        env:
          TARGET: ${{ matrix.target }}
          PACKAGE_NAME: aithy-${{ github.ref_name }}-${{ matrix.target }}
        run: |
          set -euo pipefail
          bun run package:release -- --target "$TARGET" --package-name "$PACKAGE_NAME" --outdir release
          test ! -e "release/$PACKAGE_NAME/app/workers/agent-worker.js"
          test ! -e "release/$PACKAGE_NAME/app/workers/queue-service.js"
          test ! -d "release/$PACKAGE_NAME/node_modules"
      - name: Smoke packaged app
        if: matrix.target == 'linux-x64-gnu'
        env:
          PACKAGE_NAME: aithy-${{ github.ref_name }}-${{ matrix.target }}
        run: |
          set -euo pipefail
          "release/$PACKAGE_NAME/aithy" --version
          "release/$PACKAGE_NAME/aithy" --port 31987 > smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:31987/ >/dev/null; then
              if curl -fsS http://127.0.0.1:31987/console > console.html \
                && grep -q 'queue-service' console.html \
                && grep -q 'sandbox-worker' console.html \
                && grep -q 'local-inference-worker' console.html; then
                kill "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
                exit 0
              fi
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat smoke.log
              exit 1
            fi
            sleep 1
          done
          cat smoke.log
          test ! -e console.html || cat console.html
          exit 1
      - name: Archive package
        env:
          PACKAGE_NAME: aithy-${{ github.ref_name }}-${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cd release
          tar -czf "../release-artifacts/$PACKAGE_NAME.tar.gz" "$PACKAGE_NAME"
          cd ../release-artifacts
          sha256sum "$PACKAGE_NAME.tar.gz" > "$PACKAGE_NAME.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release-artifacts/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [package, sandbox-image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-artifacts/* --clobber
          else
            gh release create "$TAG" release-artifacts/* --title "$TAG" --generate-notes
          fi
